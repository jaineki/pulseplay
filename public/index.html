<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PulsePlay Music</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>:root{--bg:#0c0f19;--card:#141c2e;--accent:#7b61ff;--accent2:#00d4ff;--text:#e9f0ff;--green:#1db954}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 10%,#1a2240,var(--bg));min-height:100vh;padding-bottom:180px}.bg-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 20%,#7b61ff44,transparent 45%),radial-gradient(circle at 20% 80%,#00d4ff22,transparent 40%)}.top-header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px}.top-header h1{margin:0;letter-spacing:1px;font-size:28px}#logout-btn{border:0;border-radius:999px;background:#243151;color:#fff;padding:8px 14px;cursor:pointer}#logout-btn:hover{background:#2f4060}.layout{padding:0 20px 170px}#searchBar{display:flex;gap:10px;margin:10px 0 20px}#searchInput{flex:1;border-radius:12px;border:1px solid #32405f;background:#10182c;color:#fff;padding:12px;font-size:14px}#searchBtn{border-radius:12px;border:0;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;padding:12px 20px;font-weight:700;cursor:pointer}#searchBtn:hover{opacity:.9}.search-type-tabs{display:flex;gap:8px;margin:-8px 0 14px;overflow-x:auto}.search-type-tabs button{padding:8px 12px;border-radius:999px;white-space:nowrap;border:1px solid #32405f;background:#10182c;color:#9bb0db;cursor:pointer;transition:all .2s}.search-type-tabs button:hover{background:#1a2a4a}.search-type-tabs button.active{background:var(--green);border-color:var(--green);color:#fff}#recommend_tag{margin:20px 0 14px;font-size:22px}#songs-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding-bottom:140px}.song-ca stify-content:flex-start;gap:14px;padding:18px 20px 90px;overflow-y:auto}.full-top-row{width:min(92vw,430px);display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:10px}#full-cover{width:min(80vw,350px);border-radius:20px;box-shadow:0 20px 50px #00000070}#minimize-btn{border:0;background:transparent;color:#d5ddf2;cursor:pointer;font-size:20px}.full-marquee{width:min(90vw,380px);text-align:center}#full-title,#full-artist{text-align:center}#full-title{font-size:27px;font-weight:800}#full-artist{color:#a9badc;font-size:18px}.lyrics-section{width:min(92vw,430px);background:#0b1227bf;border:1px solid #2c3d63;border-radius:14px;padding:12px}.lyrics-head{font-weight:700;margin-bottom:8px}.lyrics-content{max-height:220px;overflow:auto;white-space:pre-wrap;color:#d5dcf0;line-height:1.5}.lyrics-line.active{color:#77ff9e;font-weight:700}.track-menu{position:fixed;inset:0;background:#00000088;z-index:60;display:flex;align-items:flex-end;justify-content:center}.track-menu-card{width:min(500px,100%);background:#101828;border-radius:16px 16px 0 0;border:1px solid #2f3e5e;border-bottom:0;padding:8px 10px 20px}.track-menu-card button{width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:14px 10px;font-size:17px;color:var(--text);cursor:pointer}.track-menu-card button:hover{background:#1a2742}@keyframes marquee-scroll{0%{transform:translateX(0)}15%{transform:translateX(0)}100%{transform:translateX(-100%)}}.homebox{position:fixed;left:0;right:0;bottom:0;height:65px;background:#101828;border-top:1px solid #2f3d58;display:grid;grid-template-columns:repeat(4,1fr)}.homepageButtonImage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#a5b6d9;cursor:pointer}.homepageButtonImage.active,.homepageButtonImage:hover{color:#fff}.homepageButtonImage i{font-size:20px}.homepageButtonImage span{font-size:11px}.auth-modal{position:fixed;inset:0;background:#030712cc;z-index:50;display:none;align-items:center;justify-content:center}.auth-card{width:min(420px,92vw);background:#121c33;border:1px solid #304164;border-radius:20px;padding:20px}.auth-card h2{margin:0 0 8px;text-align:center}.auth-card p{color:#9bb0db;text-align:center;margin:0 0 16px}.auth-card form{display:flex;flex-direction:column;gap:10px;margin-top:12px}.auth-card form input{border-radius:12px;border:1px solid #32405f;background:#10182c;color:#fff;padding:12px;font-size:14px}.auth-card form button{background:linear-gradient(120deg,var(--accent),var(--accent2));border:0;border-radius:12px;padding:12px;font-weight:700;color:#fff;cursor:pointer}.auth-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth-switch button{padding:10px;border-radius:12px;border:1px solid #32405f;background:transparent;color:#9bb0db;cursor:pointer}.auth-switch button.active{background:#24365b;color:#fff}#auth-msg{margin-top:10px;min-height:20px;text-align:center;font-size:13px}.album-header{display:flex;gap:20px;align-items:flex-end;padding:20px 0}.album-cover{width:200px;height:200px;border-radius:12px;object-fit:cover;box-shadow:0 10px 30px #00000060}.album-info h2{margin:0 0 8px;font-size:32px}.album-info .album-artist{color:#9bb0db;font-size:16px;margin:0}.album-info .album-meta{color:#6b7fa0;font-size:13px;margin-top:8px}#searchPage .header{display:grid;grid-template-columns:50px 1fr auto;gap:10px;margin-bottom:12px}#searchPage .header button{padding:8px 12px;border-radius:10px;border:1px solid #32405f;background:#10182c;color:#fff;cursor:pointer}#searchInputPage{border-radius:12px;border:1px solid #32405f;background:#10182c;color:#fff;padding:12px;font-size:14px}.recent-block{margin-bottom:12px}.recent-head{display:flex;justify-content:space-between;align-items:center}#clearRecentBtn{padding:8px 12px;border-radius:10px;border:1px solid #32405f;background:#10182c;color:#9bb0db;cursor:pointer}#searchList,.track-list{display:flex;flex-direction:column;gap:10px}@media(max-width:640px){#player-bar{bottom:70px}.layout{padding:0 12px}.album-header{flex-direction:column;align-items:center;text-align:center}.album-cover{width:160px;height:160px}.album-info h2{font-size:24px}#songs-container{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}input[type=range]:disabled{cursor:not-allowed;opacity:.45;accent-color:#5c667d}input[type=range]:disabled::-webkit-slider-runnable-track{background:#2b3448}input[type=range]:disabled::-webkit-slider-thumb{background:#7a8498}.loading{display:flex;justify-content:center;padding:40px}.loading::after{content:"";width:36px;height:36px;border:3px solid #32405f;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty-state{text-align:center;padding:60px 20px;color:#6b7fa0}.empty-state i{font-size:48px;margin-bottom:16px;opacity:.5}</style></head><body><div class="bg-glow"></div><div id="auth-modal" class="auth-modal"><div class="auth-card"><h2>Welcome to PulsePlay</h2><p>Sign in or create your account</p><div class="auth-switch"><button id="switch-login" class="active">Login</button><button id="switch-signup">Sign up</button></div><form id="login-form"><input id="login-email" type="email" placeholder="Email" required><input id="login-password" type="password" placeholder="Password" required><button type="submit">Login</button></form><form id="signup-form" style="display:none"><input id="signup-username" type="text" placeholder="Username" required><input id="signup-email" type="email" placeholder="Email" required><input id="signup-password" type="password" placeholder="Password" required><button type="submit">Create account</button></form><div id="auth-msg"></div></div></div><header class="top-header"><h1>PulsePlay</h1><div><span id="whoami"></span><button id="logout-btn">Logout</button></div></header><main class="layout"><section id="recommend-section"><div id="searchBar"><input type="text" id="searchInput" placeholder="Search your favorite song"><button id="searchBtn">Search</button></div><div id="searchTypeTabs" class="search-type-tabs"><button data-type="track" class="active">Songs</button><button data-type="album">Albums</button><button data-type="playlist">Playlists</button><button data-type="artist">Artists</button></div><h2 id="recommend_tag">🎵 Home Songs</h2><div id="songs-container"></div></section><section id="searchPage" style="display:none"><div class="header"><button id="backBtn"><i class="fa-solid fa-angle-left"></i></button><input type="text" id="searchInputPage" placeholder="Search songs..."><button id="searchBtnPage">Search</button></div><div class="recent-block"><div class="recent-head"><h3 id="recentSearch_tag">Recent Searches</h3><button id="clearRecentBtn">Clear</button></div><div id="recentSearchList" class="track-list"></div></div><div id="searchList" class="scrollList"></div></section><section id="album-section" style="display:none"><button id="album-back-btn" style="background:none;border:none;color:#9bb0db;font-size:18px;cursor:pointer;margin-bottom:16px"><i class="fa-solid fa-angle-left"></i> Back</button><div class="album-header"><img id="album-detail-cover" class="album-cover" src="" alt="Album Cover"><div class="album-info"><h2 id="album-detail-title"></h2><p class="album-artist" id="album-detail-artist"></p><p class="album-meta" id="album-detail-meta"></p><button id="album-shuffle-btn" style="background:var(--green);border:none;border-radius:999px;padding:10px 24px;color:#fff;font-weight:700;cursor:pointer;margin-top:12px"><i class="fa-solid fa-play"></i> Play</button></div></div><div id="album-tracks" class="library-track-list"></div></section><section id="favorites-section" style="display:none"><h2 style="margin-bottom:16px">⭐ Favorites</h2><div id="favorites-list" class="track-list"></div><div id="favorites-empty" class="empty-state" style="display:none"><i class="fa-solid fa-heart"></i><p>No favorites yet. Like a song to add it here.</p></div></section><section id="playlist-section" style="display:none"><h2 style="margin-bottom:16px">🎵 Your Playlists</h2><div id="playlists-container"></div></section><section id="profile-section" style="display:none"><h2 style="margin-bottom:16px">👤 Profile</h2><div style="background:#121a2f;border:1px solid #293753;border-radius:14px;padding:20px"><div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><div style="width:60px;height:60px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px"><i class="fa-solid fa-user"></i></div><div><div id="profile-username" style="font-size:20px;font-weight:700"></div><div id="profile-email" style="color:#9bb0db;font-size:14px"></div></div></div></div></section></main><div id="player-bar" style="display:none"><div class="player-info" id="mini-player"><img id="player-cover" src="" alt="cover"><div class="player-text"><div class="mini-source-row"><button id="mini-source-link" class="mini-source-link">Recommendations</button><button id="mini-menu-btn" class="mini-menu-btn">⋮</button></div><div class="marquee-line"><div id="player-title">Song Title</div></div><div class="marquee-line"><div id="player-artist">Artist</div></div><div class="seek-wrapper"><span id="current-time">0:00</span><input type="range" id="seek-slider" min="0" max="100" value="0" disabled><span id="total-time">0:00</span></div><div class="player-controls"><button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button><button id="play-btn"><i class="fa-solid fa-play" id="play-icon"></i></button><button id="next-btn"><i class="fa-solid fa-forward-step"></i></button><button id="like-btn">🤍</button></div></div></div></div><div id="full-player" style="display:none"><div class="full-top-row"><button id="minimize-btn"><i class="fa-solid fa-angle-down"></i></button><button id="source-link" class="source-link">Recommendations</button><button id="full-menu-btn" class="full-menu-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button></div><img id="full-cover" src="" alt="cover"><div class="full-marquee"><div id="full-title">Song Title</div></div><div class="full-marquee"><div id="full-artist">Artist</div></div><div class="full-seek-wrapper"><span id="full-current-time">0:00</span><input type="range" id="full-seek-slider" min="0" max="100" value="0" disabled><span id="full-total-time">0:00</span></div><div class="full-controls"><button id="full-shuffle-btn">🔀</button><button id="full-prev-btn"><i class="fa-solid fa-backward-step"></i></button><button id="full-play-btn"><i class="fa-solid fa-play" id="full-play-icon"></i></button><button id="full-next-btn"><i class="fa-solid fa-forward-step"></i></button><button id="full-like-btn">🤍</button></div><section id="lyrics-section" class="lyrics-section"><div class="lyrics-head">Lyrics</div><div id="lyrics-content" class="lyrics-content">Lyrics will appear here.</div></section></div><div id="track-menu" class="track-menu" style="display:none"><div class="track-menu-card"><button data-action="share"><i class="fa-solid fa-share-nodes"></i> Share</button><button data-action="lyrics-toggle"><i class="fa-solid fa-music"></i> Lyrics</button><button data-action="queue-add"><i class="fa-solid fa-plus"></i> Add to Queue</button><button data-action="go-album"><i class="fa-solid fa-compact-disc"></i> Go to Album</button><button data-action="go-artist"><i class="fa-solid fa-user"></i> Go to Artist</button><button data-action="close"><i class="fa-solid fa-xmark"></i> Close</button></div></div><nav class="homebox"><button id="homePageButton" class="homepageButtonImage active"><i class="fa-solid fa-house"></i><span>Home</span></button><button id="favoritesBtn" class="homepageButtonImage"><i class="fa-solid fa-star"></i><span>Favorites</span></button><button id="playlistBtn" class="homepageButtonImage"><i class="fa-solid fa-music"></i><span>Playlist</span></button><button id="profileBtn" class="homepageButtonImage"><i class="fa-solid fa-user"></i><span>Profile</span></button></nav><audio id="audio-player"></audio><script>const API_URL="";const state={token:localStorage.getItem("token")||null,user:JSON.parse(localStorage.getItem("user")||"null"),currentTrackIndex:-1,queue:[],isPlaying:false,favorites:JSON.parse(localStorage.getItem("favorites")||"[]"),recentSearches:JSON.parse(localStorage.getItem("recentSearches")||"[]"),currentSearchType:"track",lyricSyncData:[],lyricTimer:null};const elements={authModal:document.getElementById("auth-modal"),whoami:document.getElementById("whoami"),songsContainer:document.getElementById("songs-container"),recommendTag:document.getElementById("recommend_tag"),playerBar:document.getElementById("player-bar"),fullPlayer:document.getElementById("full-player"),audioPlayer:document.getElementById("audio-player")};function getItem(k){return JSON.parse(localStorage.getItem(k)||"null")}function setItem(k,v){localStorage.setItem(k,JSON.stringify(v))}function formatTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),sec=s%60;return`${m}:${sec.toString().padStart(2,"0")}`}function showAuthMessage(msg,isError=true){const el=document.getElementById("auth-msg");el.textContent=msg;el.style.color=isError?"#ff7b7b":"#83ffa1"}function showLoading(c){c.innerHTML='<div class="loading"></div>'}function showEmpty(c,msg="No results found"){c.innerHTML=`<div class="empty-state"><p>${msg}</p></div>`}function applyAuthState(){const modal=elements.authModal,whoami=elements.whoami;if(state.token){modal.style.display="none";whoami.textContent=state.user?.username||"Logged in";document.getElementById("logout-btn").style.display="block"}else{modal.style.display="flex";whoami.textContent="";document.getElementById("logout-btn").style.display="none"}}async function apiRequest(path,options={}){const headers={"Content-Type":"application/json",...(state.token?{"Authorization":`Bearer ${state.token}`}:{}),...options.headers};const r=await fetch(path,{...options,headers});if(!r.ok){const e=await r.json().catch(()=>({detail:"Request failed"}));throw new Error(e.detail||"API Error")}return r.json()}function renderGrid(list,target,clickHandler,subtitle=true){target.innerHTML="";if(!list||!list.length){showEmpty(target);return}list.forEach((song,i)=>{const c=document.createElement("div");c.className="song-card";c.innerHTML=`<img src="${song.cover_url||""}" alt="${song.title}" onerror="this.src='https://via.placeholder.com/170/1a2a4a/9bb0db?text=♪'"><div class="song-title">${song.title}</div>${subtitle?`<div class="song-artist">${song.artist||song.name||""}</div>`:""}`;c.onclick=()=>clickHandler(i);target.appendChild(c)})}function renderTrackList(list,target,clickHandler,showDelete=false){target.innerHTML="";if(!list||!list.length){target.innerHTML='<div class="empty-state"><p>No tracks found</p></div>';return}list.forEach((song,i)=>{const r=document.createElement("div");r.className="track-row";r.innerHTML=`<img src="${song.cover_url||""}" alt="${song.title}" onerror="this.src='https://via.placeholder.com/62/1a2a4a/9bb0db?text=♪'"><div class="track-meta"><div class="track-title">${song.title}</div><div class="track-artist">${song.artist||""}</div></div><button class="track-play"><i class="fa-solid fa-play"></i></button>${showDelete?'<button class="track-remove"><i class="fa-solid fa-xmark"></i></button>':''}`;r.querySelector(".track-play").onclick=(e)=>{e.stopPropagation();clickHandler(i)};if(showDelete&&r.querySelector(".track-remove"))r.querySelector(".track-remove").onclick=(e)=>{e.stopPropagation();state.favorites.splice(i,1);setItem("favorites",state.favorites);renderFavorites()};r.onclick=()=>clickHandler(i);target.appendChild(r)})}function renderAlbumTracks(album,tracks,target){target.innerHTML="";if(!tracks||!tracks.length){target.innerHTML='<div class="empty-state"><p>No tracks in this album</p></div>';return}tracks.forEach((song,i)=>{const r=document.createElement("div");r.className="library-track-row";r.innerHTML=`<div class="library-track-index">${i+1}</div><img src="${song.cover_url||""}" alt="${song.title}" onerror="this.src='https://via.placeholder.com/52/1a2a4a/9bb0db?text=♪'"><div class="library-track-meta"><div class="library-track-title">${song.title}</div><div class="library-track-artist">${song.artist||""}</div></div><button class="library-row-play"><i class="fa-solid fa-play"></i></button>`;r.querySelector(".library-row-play").onclick=(e)=>{e.stopPropagation();playSong(song,tracks,0)};r.onclick=()=>playSong(song,tracks,i);target.appendChild(r)})}function playSong(song,queue=[],startIndex=0){if(!song)return;state.queue=queue.length?queue:[song];state.currentTrackIndex=queue.length?startIndex:0;document.getElementById("player-cover").src=song.cover_url||"";document.getElementById("player-title").textContent=song.title;document.getElementById("player-artist").textContent=song.artist||"";document.getElementById("full-cover").src=song.cover_url||"";document.getElementById("full-title").textContent=song.title;document.getElementById("full-artist").textContent=song.artist||"";elements.playerBar.style.display="flex";updateLikeButton(song);loadLyrics(song.track_id||song.audio_id)}async function loadAndPlay(song){try{const r=await apiRequest("/download",{method:"POST",body:JSON.stringify({id:song.audio_id||song.track_id})});const blob=new Blob([r]);const url=URL.createObjectURL(blob);elements.audioPlayer.src=url;elements.audioPlayer.play();state.isPlaying=true;updatePlayButtons()}catch(err){console.log("Audio playback not available:",err.message);state.isPlaying=false;updatePlayButtons()}}function updatePlayButtons(){const icon=state.isPlaying?"fa-pause":"fa-play";document.getElementById("play-icon").className=`fa-solid ${icon}`;document.getElementById("full-play-icon").className=`fa-solid ${icon}`}function togglePlay(){if(elements.audioPlayer.paused){elements.audioPlayer.play();state.isPlaying=true}else{elements.audioPlayer.pause();state.isPlaying=false}updatePlayButtons()}function playNext(){if(state.currentTrackIndex<state.queue.length-1){state.currentTrackIndex++;playSong(state.queue[state.currentTrackIndex],state.queue,state.currentTrackIndex)}}function playPrev(){if(state.currentTrackIndex>0){state.currentTrackIndex--;playSong(state.queue[state.currentTrackIndex],state.queue,state.currentTrackIndex)}}function updateLikeButton(song){const isFav=state.favorites.some(f=>f.audio_id===song.audio_id||f.track_id===song.track_id);const lb=document.getElementById("like-btn");const flb=document.getElementById("full-like-btn");lb.textContent=isFav?"💚":"🤍";flb.textContent=isFav?"💚":"🤍"}async function loadLyrics(trackId){if(!trackId)return;try{const data=await apiRequest(`/getLyrics?track_id=${trackId}&is_sync=True`);state.lyricSyncData=data?.data||[];renderSyncedLyrics(state.lyricSyncData)}catch(err){document.getElementById("lyrics-content").textContent="Lyrics unavailable."}}function renderSyncedLyrics(lines){const lc=document.getElementById("lyrics-content");lc.innerHTML=lines.map((l,i)=>`<div class="lyrics-line" data-idx="${i}">${l.words||""}</div>`).join("");stopLyricSync();state.lyricTimer=setInterval(()=>{const now=Math.floor((elements.audioPlayer.currentTime||0)*1000);let ai=-1;lines.forEach((l,i)=>{if(Number(l.startTimeMs||0)<=now)ai=i});lc.querySelectorAll(".lyrics-line").forEach(el=>el.classList.remove("active"));if(ai>=0){const a=lc.querySelector(`.lyrics-line[data-idx="${ai}"]`);if(a){a.classList.add("active");a.scrollIntoView({block:"nearest"})}}},350)}function stopLyricSync(){if(state.lyricTimer){clearInterval(state.lyricTimer);state.lyricTimer=null}}function showPage(pn){document.getElementById("recommend-section").style.display="none";document.getElementById("searchPage").style.display="none";document.getElementById("album-section").style.display="none";document.getElementById("favorites-section").style.display="none";document.getElementById("playlist-section").style.display="none";document.getElementById("profile-section").style.display="none";document.querySelectorAll(".homepageButtonImage").forEach(b=>b.classList.remove("active"));switch(pn){case"home":document.getElementById("recommend-section").style.display="block";document.getElementById("homePageButton").classList.add("active");break;case"search":document.getElementById("searchPage").style.display="block";break;case"album":document.getElementById("album-section").style.display="block";document.getElementById("homePageButton").classList.add("active");break;case"favorites":document.getElementById("favorites-section").style.display="block";document.getElementById("favoritesBtn").classList.add("active");renderFavorites();break;case"playlist":document.getElementById("playlist-section").style.display="block";document.getElementById("playlistBtn").classList.add("active");loadPlaylists();break;case"profile":document.getElementById("profile-section").style.display="block";document.getElementById("profileBtn").classList.add("active");loadProfile();break}}async function loadHomeSongs(){try{showLoading(elements.songsContainer);const data=await apiRequest("/search?q=&search_type=track&limit=20");const tracks=data.tracks||data||[];renderGrid(tracks,elements.songsContainer,i=>playSong(tracks[i],tracks,i))}catch(err){showEmpty(elements.songsContainer,"Failed to load songs")}}async function searchSongs(query,type="track"){try{showLoading(elements.songsContainer);const data=await apiRequest(`/search?q=${encodeURIComponent(query)}&search_type=${type}&limit=20`);const items=data.tracks||data.albums||data.playlists||data.artists||[];if(query.trim()&&!state.recentSearches.includes(query)){state.recentSearches.unshift(query);state.recentSearches=state.recentSearches.slice(0,10);setItem("recentSearches",state.recentSearches)}renderGrid(items,elements.songsContainer,i=>{if(type==="track")playSong(items[i],items,i);else if(type==="album")loadAlbumDetail(items[i])});elements.recommendTag.textContent=`🔍 Search: ${query}`}catch(err){showEmpty(elements.songsContainer,"Search failed")}}async function loadAlbumDetail(album){try{showPage("album");const data=await apiRequest(`/album/${album.id||album.title}`);document.getElementById("album-detail-cover").src=data.cover_url||"";document.getElementById("album-detail-title").textContent=data.title||"";document.getElementById("album-detail-artist").textContent=data.artist||"";document.getElementById("album-detail-meta").textContent=`${data.total_tracks||data.tracks?.length||0} tracks • ${data.release_date||""}`;const tracks=data.tracks||[];renderAlbumTracks(data,tracks,document.getElementById("album-tracks"));document.getElementById("album-shuffle-btn").onclick=()=>{if(tracks.length)playSong(tracks[0],tracks,0)}}catch(err){console.error("Failed to load album:",err)}}function renderFavorites(){const list=document.getElementById("favorites-list");const empty=document.getElementById("favorites-empty");if(state.favorites.length===0){list.style.display="none";empty.style.display="block"}else{list.style.display="flex";empty.style.display="none";renderTrackList(state.favorites,list,i=>playSong(state.favorites[i],state.favorites,i),true)}}async function loadPlaylists(){const c=document.getElementById("playlists-container");try{const data=await apiRequest("/playlists");c.innerHTML="";(data.playlists||[]).forEach(pl=>{const card=document.createElement("div");card.className="song-card";card.style.marginBottom="14px";card.innerHTML=`<div style="display:flex;align-items:center;gap:14px"><div style="width:60px;height:60px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-list" style="font-size:24px"></i></div><div><div class="song-title">${pl.name}</div><div class="song-artist">${pl.track_count||0} tracks</div></div></div>`;c.appendChild(card)})}catch(err){c.innerHTML='<div class="empty-state"><p>Failed to load playlists</p></div>'}}async function loadProfile(){try{const data=await apiRequest("/profile");document.getElementById("profile-username").textContent=data.username||"";document.getElementById("profile-email").textContent=data.email||""}catch(err){document.getElementById("profile-username").textContent=state.user?.username||"User";document.getElementById("profile-email").textContent=state.user?.email||""}}document.getElementById("switch-login").addEventListener("click",()=>{document.getElementById("login-form").style.display="flex";document.getElementById("signup-form").style.display="none";document.getElementById("switch-login").classList.add("active");document.getElementById("switch-signup").classList.remove("active")});document.getElementById("switch-signup").addEventListener("click",()=>{document.getElementById("login-form").style.display="none";document.getElementById("signup-form").style.display="flex";document.getElementById("switch-signup").classList.add("active");document.getElementById("switch-login").classList.remove("active")});document.getElementById("login-form").addEventListener("submit",async ev=>{ev.preventDefault();try{const email=document.getElementById("login-email").value;const password=document.getElementById("login-password").value;const data=await apiRequest("/auth/login",{method:"POST",body:JSON.stringify({email,password})});localStorage.setItem("token",data.token);state.token=data.token;state.user={username:data.username,email:data.email};setItem("user",state.user);applyAuthState();showAuthMessage("Login successful",false);setTimeout(()=>showPage("home"),500)}catch(err){showAuthMessage(err.message)}});document.getElementById("signup-form").addEventListener("submit",async ev=>{ev.preventDefault();try{const username=document.getElementById("signup-username").value;const email=document.getElementById("signup-email").value;const password=document.getElementById("signup-password").value;const data=await apiRequest("/auth/signup",{method:"POST",body:JSON.stringify({username,email,password})});localStorage.setItem("token",data.token);state.token=data.token;state.user={username:data.username,email:data.email};setItem("user",state.user);applyAuthState();showAuthMessage("Account created",false);setTimeout(()=>showPage("home"),500)}catch(err){showAuthMessage(err.message)}});document.getElementById("logout-btn").addEventListener("click",()=>{localStorage.removeItem("token");localStorage.removeItem("user");state.token=null;state.user=null;applyAuthState()});document.getElementById("searchBtn").addEventListener("click",()=>{const q=document.getElementById("searchInput").value.trim();if(q)searchSongs(q,state.currentSearchType)});document.getElementById("searchInput").addEventListener("keypress",e=>{if(e.key==="Enter"){const q=document.getElementById("searchInput").value.trim();if(q)searchSongs(q,state.currentSearchType)}});document.querySelectorAll(".search-type-tabs button").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".search-type-tabs button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");state.currentSearchType=btn.dataset.type})});document.getElementById("play-btn").addEventListener("click",togglePlay);document.getElementById("full-play-btn").addEventListener("click",togglePlay);document.getElementById("next-btn").addEventListener("click",playNext);document.getElementById("full-next-btn").addEventListener("click",playNext);document.getElementById("prev-btn").addEventListener("click",playPrev);document.getElementById("full-prev-btn").addEventListener("click",playPrev);document.getElementById("like-btn").addEventListener("click",()=>{if(state.currentTrackIndex>=0&&state.queue[state.currentTrackIndex]){const song=state.queue[state.currentTrackIndex];const idx=state.favorites.findIndex(f=>f.audio_id===song.audio_id);if(idx===-1)state.favorites.push(song);else state.favorites.splice(idx,1);setItem("favorites",state.favorites);updateLikeButton(song)}});elements.audioPlayer.addEventListener("timeupdate",()=>{const cur=elements.audioPlayer.currentTime*1000;const tot=elements.audioPlayer.duration*1000||0;const prog=tot>0?(cur/tot)*100:0;document.getElementById("seek-slider").value=prog;document.getElementById("full-seek-slider").value=prog;document.getElementById("current-time").textContent=formatTime(cur);document.getElementById("full-current-time").textContent=formatTime(cur);document.getElementById("total-time").textContent=formatTime(tot);document.getElementById("full-total-time").textContent=formatTime(tot)});elements.audioPlayer.addEventListener("ended",playNext);document.getElementById("seek-slider").addEventListener("input",e=>{if(elements.audioPlayer.duration)elements.audioPlayer.currentTime=(e.target.value/100)*elements.audioPlayer.duration});document.getElementById("full-seek-slider").addEventListener("input",e=>{if(elements.audioPlayer.duration)elements.audioPlayer.currentTime=(e.target.value/100)*elements.audioPlayer.duration});document.getElementById("minimize-btn").addEventListener("click",()=>{elements.fullPlayer.style.display="none"});document.getElementById("mini-player").addEventListener("click",()=>{elements.fullPlayer.style.display="flex"});document.getElementById("mini-menu-btn").addEventListener("click",()=>{document.getElementById("track-menu").style.display="flex"});document.getElementById("full-menu-btn").addEventListener("click",()=>{document.getElementById("track-menu").style.display="flex"});document.querySelectorAll("#track-menu button").forEach(btn=>{btn.addEventListener("click",()=>{if(btn.dataset.action==="close")document.getElementById("track-menu").style.display="none"})});document.getElementById("homePageButton").addEventListener("click",()=>{showPage("home");loadHomeSongs()});document.getElementById("favoritesBtn").addEventListener("click",()=>showPage("favorites"));document.getElementById("playlistBtn").addEventListener("click",()=>showPage("playlist"));document.getElementById("profileBtn").addEventListener("click",()=>showPage("profile"));document.getElementById("album-back-btn").addEventListener("click",()=>{showPage("home");loadHomeSongs()});document.getElementById("clearRecentBtn").addEventListener("click",()=>{state.recentSearches=[];setItem("recentSearches",[]);document.getElementById("recentSearchList").innerHTML=""});applyAuthState();loadHomeSongs()</script></body></html>
